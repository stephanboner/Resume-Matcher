name: Fork photo feature checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - '.github/workflows/fork-photo-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Prepare Python
        working-directory: apps/backend
        run: uv python install 3.14
      - name: Install multilingual PDF fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Run backend regression suite
        working-directory: apps/backend
        run: |
          uv sync --extra dev
          uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install
        working-directory: apps/frontend
        run: npm ci
      - name: Typecheck
        working-directory: apps/frontend
        run: npm run typecheck
      - name: Test crop geometry
        working-directory: apps/frontend
        run: npx vitest run tests/adaptive-crop-box.test.ts
      - name: Run frontend regression suite
        working-directory: apps/frontend
        run: npm test
      - name: Build
        working-directory: apps/frontend
        run: npm run build
